[project]
name = "council-backend"
version = "0.1.0"
requires-python = ">=3.11"
# 版本钉死：让 Zeabur / 本地 / CI 构建可复现。升级时统一改这里。
# 版本取自 backend/.venv 实测（2026-07-29），已通过冒烟测试。
dependencies = [
    "fastapi==0.139.2",
    "uvicorn[standard]==0.51.0",
    "pydantic==2.13.4",
    "pydantic-settings==2.14.2",
    "langgraph==1.2.9",
    "langgraph-checkpoint-postgres==3.1.0",
    "langchain-openai==1.3.5",
    "langchain-core==1.4.9",
    "supabase==2.31.0",
    "psycopg[binary]==3.3.4",
    "psycopg-pool==3.3.1",
    "sse-starlette==3.4.5",
]

[project.optional-dependencies]
# Decision Agent Runtime V4（Phase 1）：Codex App Server Python SDK，
# 含钉死版本的本地 runtime 二进制。生产镜像暂不安装（Phase 8 再评估），
# 缺失时 CodexAgentRuntime 构造抛 codex_sdk_unavailable，legacy 流程不受影响。
codex = [
    "openai-codex==0.147.0",
]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "httpx==0.28.1",
    "ruff==0.15.22",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
