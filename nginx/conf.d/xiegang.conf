# 邪杠会议室 nginx 反代配置
# 放在仓库的 nginx/conf.d/xiegang.conf
# 用 docker-compose.prod.yml 时挂载进去

# SSE 关键 timeout 设置(默认 60s 太短会断流):
#   proxy_buffering off  必须关否则客户端收不到流
#   proxy_read_timeout 900s 等于议会最长时长 15 分钟,给足

# 用法:
#   1. 先拿个临时域名(腾讯云送一个 *.lighthouseapp.local 或自有域名)
#   2. certbot --nginx -d <域名> 自动签 Let's Encrypt 证书

upstream xiegang_web {
    server web:8000;
}

# HTTP - 用于 certbot 验证 + 跳 HTTPS
server {
    listen 80;
    server_name _;

    # certbot 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他全部跳 HTTPS(等证书签好后再开)
    location / {
        # 临时:还没证书前,允许 HTTP 直连到后端
        proxy_pass http://xiegang_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # SSE 关键
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
}

