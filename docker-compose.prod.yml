services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: xiegang-backend:latest
    container_name: xiegang-web
    restart: unless-stopped
    env_file: .env
    expose:
      - "8000"
    networks:
      - xiegang-net
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: xiegang-backend:latest
    container_name: xiegang-worker
    restart: unless-stopped
    env_file: .env
    command: ["python", "-m", "app.worker"]
    networks:
      - xiegang-net

  nginx:
    image: nginx:alpine
    container_name: xiegang-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      # 把项目里的 nginx/certs 目录挂进容器(证书已经在里面了, perms 644)
      - ./nginx/certs:/etc/nginx/certs:ro
      # certbot ACME HTTP-01 验证目录（switch-domain.sh 用）
      - ./nginx/certbot-www:/var/www/certbot:ro
      - ./nginx/logs:/var/log/nginx
    networks:
      - xiegang-net
    depends_on:
      - web

networks:
  xiegang-net:
    driver: bridge
